name: Release

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Slack - inicio
        run: |
          bash .github/scripts/slack.sh ":rocket: *RELEASE* ${{ github.ref_name }} iniciado (<$RUN_URL|ver ejecucion>)"

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias y build
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Login en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construir y publicar imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/ejercicios-dom3:${{ github.ref_name }}
            ${{ secrets.DOCKERHUB_USERNAME }}/ejercicios-dom3:latest

      - name: Slack - release OK
        if: success()
        run: |
          bash .github/scripts/slack.sh ":whale: *RELEASE* publicado en Docker Hub - ejercicios-dom3:${{ github.ref_name }}"

      - name: Slack - falla
        if: failure()
        run: |
          bash .github/scripts/slack.sh ":x: *RELEASE* ${{ github.ref_name }} fallo. <$RUN_URL|ver log>"