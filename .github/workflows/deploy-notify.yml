name: Deploy Notify

on:
  push:
    branches: [main]

jobs:
  notify:
    runs-on: ubuntu-latest
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      SITE_URL: https://ejerciciosdom3.netlify.app
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Slack - deploy iniciado
        run: |
          bash .github/scripts/slack.sh ":rocket: *DEPLOY* Netlify iniciado para el commit ${GITHUB_SHA::7}"

      - name: Esperar a que Netlify publique
        id: espera
        run: |
          for i in $(seq 1 30); do
            V=$(curl -s "$SITE_URL/version.txt?$RANDOM" || true)
            if [ "$V" = "$GITHUB_SHA" ]; then
              echo "publicado=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 20
          done
          echo "publicado=false" >> "$GITHUB_OUTPUT"

      - name: Slack - deploy exitoso
        if: steps.espera.outputs.publicado == 'true'
        run: |
          bash .github/scripts/slack.sh ":globe_with_meridians: *DEPLOY* Netlify publicado: $SITE_URL"

      - name: Slack - deploy no confirmado
        if: steps.espera.outputs.publicado != 'true'
        run: |
          bash .github/scripts/slack.sh ":x: *DEPLOY* No se confirmo la publicacion en 10 minutos, revisar Netlify"